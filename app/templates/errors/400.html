{% extends "base.html" %}
{% block title %}Request problem{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h1>That request could not be completed</h1>
  <p>{{ message or "Please go back and try again." }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user else url_for('auth.home') }}">Go back</a>
</section>
{% endblock %}
